events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Health check konfiguracija
        server app-replica-1:8082 max_fails=3 fail_timeout=30s;
        server app-replica-2:8082 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # Health check za load balancer
        location /health {
            access_log off;
            return 200 "Load Balancer OK\n";
            add_header Content-Type text/plain;
        }

        # Proxy svih API zahteva
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Automatski prebacivanje na drugu repliku ako prva ne radi
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}