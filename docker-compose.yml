version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: jutjubic-postgres
    environment:
      POSTGRES_DB: jutjubic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jutjubic-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jutjubic-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - jutjubic-network

  redis:
    image: redis:7-alpine
    container_name: jutjubic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MONITORING REDIS (port 6380)
  redis-monitoring:
    image: redis:7-alpine
    container_name: jutjubic-redis-monitoring
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-monitoring-data:/data
    networks:
      - monitoring

  # prikuplja metrike
  prometheus:
    image: prom/prometheus:latest
    container_name: jutjubic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  # vizualizacija
  grafana:
    image: grafana/grafana:latest
    container_name: jutjubic-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus


volumes:
  postgres-data:
  redis-data:
  redis-monitoring-data:
  prometheus-data:
  grafana-data:

networks:
  jutjubic-network:
    driver: bridge
  monitoring:
    driver: bridge